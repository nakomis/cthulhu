services:
  cthulhu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cthulhu:local
    restart: unless-stopped

    # UDP broadcast discovery does not survive Docker's bridge networking, and
    # broadcast does not cross subnets either. Host networking is REQUIRED for
    # discovery to work at all; without it, PRINTER_IP is the only route to the
    # printer. Both paths are supported deliberately - see CTHU-10.
    network_mode: host

    environment:
      PORT: 9120
      # Set PRINTER_IP in .env when the printer is not on Luke's subnet.
      PRINTER_IP: ${PRINTER_IP:-}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      # Uncomment once a magnetic flex plate is fitted, so Magic Files can
      # generate a matching Z-offset config gcode (CTHU-30). 3.2 mm is the
      # magnet+steel stack thickness verified on the real printer.
      # PLATE_Z_OFFSET_MM: ${PLATE_Z_OFFSET_MM:-3.2}
    env_file:
      - .env

    volumes:
      - cthulhu-data:/data

    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9120/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cthulhu-data:
